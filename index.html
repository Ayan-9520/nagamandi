<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f6b45" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta
      name="description"
      content="Naga Mandi OS demonstration desk for Nagaland Mandi operations. Fictional records only."
    />
    <title>Naga Mandi OS</title>
    <script>
      try {
        const raw = localStorage.getItem('naga-mandi-os.ui')
        const theme = raw ? JSON.parse(raw).state.theme : 'light'
        if (theme === 'dark') document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.style.colorScheme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
